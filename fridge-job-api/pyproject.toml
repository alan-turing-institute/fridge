[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fridge-job-api"
version = "0.7.0"
description = "An API for managing and monitoring jobs in the FRIDGE system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.140.13",
    "kubernetes>=36.0.0",
    "boto3>=1.34",
    "requests>=2.34.2",
]

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
