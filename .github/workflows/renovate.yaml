name: Renovate
on:
  workflow_dispatch:
  # Runs weekly (At 06:00 UTC every Monday)
  schedule:
    - cron: '0 6 * * 1'
  # Re-run when someone ticks a checkbox on the Dependency Dashboard (e.g. to
  # approve a gated upgrade), so approvals don't wait for the next scheduled run.
  # Note: issue-triggered workflows always run from the default branch.
  issues:
    types: [edited]

# Never run two Renovate jobs against the repo at once; queue instead.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    # For issue edits, only react to a human editing the Dependency Dashboard.
    # Renovate rewrites the dashboard itself on every run; ignoring bot edits
    # stops it re-triggering itself in a loop.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
       github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Short-lived (1 hour) token for the fridge-renovate GitHub App, scoped
      # to this repository only.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.15
        with:
          configurationFile: renovate.json
          # Pinned Renovate version, "full" image variant (includes the
          # language tools needed for lock file updates).
          renovate-version: 44.262.1-full
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
