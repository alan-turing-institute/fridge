name: fridge-isolated
description: Deploy the isolated cluster of the FRIDGE
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
config:
  access_cluster_load_balancer_ip:
    type: string
    description: The load balancer IP address of the access cluster deployment. Not required on AKS
  access_cluster_stack:
    type: string
    description: The Pulumi stack name of the access cluster deployment
  azure_subscription_id:
    type: string
    description: Azure Subscription ID for the access cluster - use a dummy value when not deploying to AKS
  azure_resource_group:
    type: string
    description: Azure Resource Group for the access cluster - use a dummy value when not deploying to AKS
  azure_disk_encryption_set:
    type: string
    description: Azure Disk Encryption Set resource name for the access cluster - use a dummy value when not deploying to AKS
  fridge_api_admin:
    type: string
    description: Admin username for the FRIDGE API
    secret: true
  fridge_api_ip:
    type: string
    description: IP address for the FRIDGE API service. Not required on Dawn.
  fridge_api_password:
    type: string
    description: Admin password for the FRIDGE API
    secret: true
  k8s_env:
    type: string
    description: The Kubernetes environment type (e.g. AKS, Dawn)
  minio_root_user:
    type: string
    description: MinIO root user
    secret: true
  minio_root_password:
    type: string
    description: MinIO root password
    secret: true
  minio_pool_size:
    type: string
    description: Size of the MinIO storage pool (e.g., 20Gi)
  organization_name:
    type: string
    description: The Pulumi organization name
  project_name:
    type: string
    description: The Pulumi project name for the access cluster deployment
  kubernetes:context:
    value: ""
    description: Kubernetes context for the FRIDGE deployment
