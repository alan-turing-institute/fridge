---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-copy
  namespace: argo-workflows
spec:
  entrypoint: pull-data-from-seaweedfs
  serviceAccountName: argo-workflow
  templates:
    - name: pull-data-from-seaweedfs
      inputs:
        parameters:
          - name: direction
          - name: bucket
          - name: files
      volumes:
        - name: workflow-data-ingress
          persistentVolumeClaim:
            claimName: replace_me
        - name: ssl-certs
          secret:
            secretName: trusted-certificates
      container:
        name: copy
        image: buildpack-deps:curl
        command: ["/bin/sh", "-c"]
        # Parameters are passed as environment variables so that filenames are never
        # interpolated into the shell script itself.
        env:
          - name: DIRECTION
            value: "{{inputs.parameters.direction}}"
          - name: BUCKET
            value: "{{inputs.parameters.bucket}}"
          - name: FILES
            value: "{{inputs.parameters.files}}"
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: argo-artifacts-s3
                key: accesskey
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: argo-artifacts-s3
                key: secretkey
        args:
          - |
            S3_URL="https://seaweedfs-s3.seaweedfs.svc.cluster.local:8334"
            copy_jobs=""

            if [ "$DIRECTION" != "ingress" ] && [ "$DIRECTION" != "egress" ]; then
              echo "Invalid direction parameter: $DIRECTION"
              exit 1
            fi

            # Split FILES on ";" only, with globbing disabled, so names containing
            # spaces or glob characters are preserved.
            set -f
            IFS=';'
            for file in $FILES; do
              [ -z "$file" ] && continue
              echo "Copying $file"
              (
                tmp_out=$(mktemp)
                if [ "$DIRECTION" = "ingress" ]; then
                  # S3 to PVC
                  http_code=$(curl -s \
                    --aws-sigv4 "aws:amz:us-east-1:s3" \
                    --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
                    -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
                    "$S3_URL/$BUCKET/$file" \
                    -o "$tmp_out" \
                    -w "%{http_code}")
                else
                  # PVC to S3
                  if [ ! -f "/data/$file" ]; then
                    echo "File /data/$file does not exist"
                    exit 1
                  fi
                  http_code=$(curl -sS \
                    --aws-sigv4 "aws:amz:us-east-1:s3" \
                    --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
                    -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
                    -T "/data/$file" \
                    "$S3_URL/$BUCKET/$file" \
                    -o "$tmp_out" \
                    -w "%{http_code}")
                fi

                if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                  echo "Failed to copy $file (HTTP $http_code)"
                  echo "Response: $(cat "$tmp_out")"
                  rm -f "$tmp_out"
                  exit 1
                fi

                if [ "$DIRECTION" = "ingress" ]; then
                  mkdir -p "$(dirname "/data/$file")"
                  mv "$tmp_out" "/data/$file"
                else
                  rm -f "$tmp_out"
                fi
              ) &
              copy_jobs="$copy_jobs $!"
            done
            unset IFS

            # Monitor copy job background tasks
            for pid in $copy_jobs; do
                wait "$pid"
                code=$?

                if [ "$code" -ne 0 ]; then
                    echo "Copy failed (PID $pid, exit code $code)"
                    kill $copy_jobs 2>/dev/null   # Stop all remaining copies
                    exit "$code"
                fi
            done

            echo "All copy jobs complete."
            exit 0
        volumeMounts:
          - name: workflow-data-ingress
            mountPath: /data
          - name: ssl-certs
            mountPath: /etc/ssl/certs
            readOnly: true
  ttlStrategy:
    secondsAfterSuccess: 3600 # 1 hour
    secondsAfterFailure: 604800 # 1 week
