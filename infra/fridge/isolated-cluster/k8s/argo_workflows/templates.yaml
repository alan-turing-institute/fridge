---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-copy
  namespace: argo-workflows
spec:
  entrypoint: pull-data-from-minio
  serviceAccountName: argo-workflow
  templates:
    - name: pull-data-from-minio
      inputs:
        parameters:
          - name: bucket
          - name: files
      volumes:
        - name: workflow-data-ingress
          persistentVolumeClaim:
            claimName: replace_me
        - name: ssl-certs
          secret:
            secretName: trusted-certificates
      container:
        name: copy
        image: buildpack-deps:curl
        command: ["/bin/sh", "-c"]
        args:
          - |
            copy_jobs=""
            if [ "{{inputs.parameters.bucket}}" = "ingress" ]; then
            # S3 to PVC
              for file in $(echo "{{inputs.parameters.files}}" | tr ";" " "); do
                echo "Copying $file"
                (
                  tmp_out=$(mktemp)
                  http_code=$(curl -s \
                    https://minio.argo-artifacts.svc.cluster.local/{{inputs.parameters.bucket}}/$file \
                    -o $tmp_out \
                    -w "%{http_code}")
                  if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                    echo "Failed to copy $file (HTTP $http_code)"
                    echo "Response: $(cat $tmp_out)"
                    rm -f $tmp_out
                    exit 1
                  fi
                  mv $tmp_out /data/$file
                ) &
                copy_jobs="$copy_jobs $!"
              done

            elif [ "{{inputs.parameters.bucket}}" = "egress" ]; then
            # PVC to S3
              for file in $(echo "{{inputs.parameters.files}}" | tr ";" " "); do
                echo "Copying $file"
                (
                  if [ ! -f /data/$file ]; then
                    echo "File /data/$file does not exist"
                    exit 1
                  fi
                  http_code=$(curl -s \
                    -T "/data/$file" \
                    https://minio.argo-artifacts.svc.cluster.local/{{inputs.parameters.bucket}}/$file \
                    - o /tmp/curl_out \
                    -w "%{http_code}")
                  if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
                    echo "Failed to copy $file (HTTP $http_code)"
                    echo "Response: $(cat /tmp/curl_out)"
                    exit 1
                  fi
                ) &
                copy_jobs="$copy_jobs $!"
              done

            else
              echo "Invalid bucket parameter: {{inputs.parameters.bucket}}"
              exit 1
            fi

            # Monitor copy job background tasks
            for pid in $copy_jobs; do
                wait "$pid"
                code=$?

                if [ "$code" -ne 0 ]; then
                    echo "Copy failed (PID $pid, exit code $code)"
                    kill $copy_jobs 2>/dev/null   # Stop all remaining downloads
                    exit "$code"
                fi
            done

            echo "All copy jobs complete."
            exit 0
        volumeMounts:
          - name: workflow-data-ingress
            mountPath: /data
          - name: ssl-certs
            mountPath: /etc/ssl/certs
            readOnly: true
