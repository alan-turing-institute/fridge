apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: amd-gpu-simulate-cnn
  namespace: argo-workflows
spec:
  entrypoint: amd-gpu-cnn
  securityContext:
    supplementalGroups:
      - 992
  templates:
    - name: amd-gpu-cnn
      container:
        volumeMounts:
          - name: block-storage
            mountPath: /tmp
        resources:
          limits:
            amd.com/gpu: 1
        image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
        command: ["python3"]
        args: ["/tmp/single_gpu_example.py"]
  serviceAccountName: argo-workflow
  volumes:
    - name: block-storage
      persistentVolumeClaim:
        claimName: block-storage-pvc
  ttlStrategy:
    secondsAfterCompletion: 3600 # 1 hour
