apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: amd-resnet50
  namespace: argo-workflows
spec:
  entrypoint: amd-resnet50
  securityContext:
    supplementalGroups:
      - 992
  templates:
    - name: amd-resnet50
      container:
        resources:
          limits:
            amd.com/gpu: 1
        image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
        command: ["bash", "-c"]
        args:
          - |
            echo "Checking GPU devices"
            ls -l /dev/kfd /dev/dri || true

            cat << 'EOF' > /tmp/resnet50_bench.py
            import time
            import torch
            import torch.nn as nn
            import torch.optim as optim
            import torchvision.models as models

            print('GPU available:', torch.cuda.is_available())
            print('GPU count:', torch.cuda.device_count())
            if not torch.cuda.is_available():
                print('GPU not available, exiting')
                exit(1)

            device = torch.device('cuda:0')
            torch.cuda.set_device(device)

            # Synthetic ImageNet-style data
            batch_size = 256
            num_batches = 200
            x = torch.randn(batch_size, 3, 224, 224, device=device)
            y = torch.randint(0, 1000, (batch_size,), device=device)

            model = models.resnet50().to(device)
            criterion = nn.CrossEntropyLoss()
            optimizer = optim.SGD(model.parameters(), lr=0.01, momentum=0.9)

            print('Warming up...')
            model.train()
            for _ in range(3):
                optimizer.zero_grad()
                with torch.amp.autocast('cuda', dtype=torch.bfloat16):
                    outputs = model(x)
                    loss = criterion(outputs, y)
                loss.backward()
                optimizer.step()
            torch.cuda.synchronize()

            print(f'Beginning benchmark: {num_batches} batches of {batch_size} images (224x224, synthetic ImageNet)')
            start = time.time()

            for i in range(num_batches):
                optimizer.zero_grad()
                with torch.amp.autocast('cuda', dtype=torch.bfloat16):
                    outputs = model(x)
                    loss = criterion(outputs, y)
                loss.backward()
                optimizer.step()

                if i % 10 == 0:
                    print(f'Batch {i}/{num_batches}, Loss {loss.item():.4f}')

            torch.cuda.synchronize()
            end = time.time()

            elapsed = end - start
            total_images = batch_size * num_batches
            print(f'Benchmark complete')
            print(f'Total time: {elapsed:.3f} seconds')
            print(f'Images/sec: {total_images / elapsed:.1f}')
            print(f'Avg batch time: {elapsed / num_batches * 1000:.2f} ms')
            EOF

            echo "Running ResNet-50 benchmark on a single GPU"
            python3 /tmp/resnet50_bench.py
  serviceAccountName: argo-workflow
  ttlStrategy:
    secondsAfterCompletion: 3600 # 1 hour
