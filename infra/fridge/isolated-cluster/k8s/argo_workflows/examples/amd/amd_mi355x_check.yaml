apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: amd-gpu-example
  namespace: argo-workflows
spec:
  entrypoint: amd-gpu-task
  securityContext:
    supplementalGroups:
      - 992
  templates:
    - name: amd-gpu-task
      container:
        resources:
          limits:
            amd.com/gpu: 1
        image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
        command: ["bash", "-c"]
        args:
          - |
            echo "Checking GPU devices"
            ls -l /dev/kfd /dev/dri || true

            echo "Running PyTorch GPU test"
            python3 -c "
            import time
            import torch
            print('GPU available:', torch.cuda.is_available())
            print('GPU count:', torch.cuda.device_count())
            if not torch.cuda.is_available():
              print('GPU not available')
              exit(1)

            device = torch.device('cuda')
            print('Using device:', torch.cuda.get_device_name(0))

            # Warmup
            a = torch.randn((4096, 4096), device=device)
            b = torch.randn((4096, 4096), device=device)
            torch.cuda.synchronize()
            # Benchmark
            start = time.time()
            for _ in range(10):
              c = a @ b
              torch.cuda.synchronize()
            end = time.time()

            print('10 matmul ops took:', end - start, 'seconds')
            print('Average per matmul:', (end - start) / 10, 'seconds')"
  serviceAccountName: argo-workflow
  ttlStrategy:
    secondsAfterCompletion: 3600 # 1 hour
