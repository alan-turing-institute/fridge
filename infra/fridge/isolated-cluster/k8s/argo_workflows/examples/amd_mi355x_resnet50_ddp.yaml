apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: amd-resnet50-ddp
  namespace: argo-workflows
spec:
  entrypoint: ddp
  securityContext:
    supplementalGroups:
      - 992
  serviceAccountName: argo-workflow
  templates:
    - name: ddp
      steps:
        - - name: rank
            template: train
            arguments:
              parameters:
                - name: rank
                  value: "{{item}}"
            withItems: [0, 1]

    - name: train
      inputs:
        parameters:
          - name: rank
      metadata:
        labels:
          ddp-job: amd-resnet50-ddp
          ddp-rank: "{{inputs.parameters.rank}}"
      # One rank per node, as each node has a single GPU
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  ddp-job: amd-resnet50-ddp
      container:
        resources:
          limits:
            amd.com/gpu: 1
        image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
        env:
          - name: NODE_RANK
            value: "{{inputs.parameters.rank}}"
          - name: MASTER_SERVICE
            value: amd-ddp-master.argo-workflows.svc.cluster.local
          # Assumes plain Ethernet between nodes; remove NCCL_IB_DISABLE if RDMA is exposed to pods
          - name: NCCL_IB_DISABLE
            value: "1"
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: NCCL_DEBUG
            value: INFO
        command: ["bash", "-c"]
        args:
          - |
            echo "Checking GPU devices"
            ls -l /dev/kfd /dev/dri || true

            cat << 'EOF' > /tmp/resnet50_ddp.py
            import os
            import time
            import torch
            import torch.nn as nn
            import torch.optim as optim
            import torch.distributed as dist
            import torchvision.models as models
            from torch.nn.parallel import DistributedDataParallel as DDP

            def main():
                rank = int(os.environ['RANK'])
                local_rank = int(os.environ['LOCAL_RANK'])
                world_size = int(os.environ['WORLD_SIZE'])

                dist.init_process_group(backend='nccl', init_method='env://', world_size=world_size, rank=rank)

                device = torch.device(f'cuda:{local_rank}')
                torch.cuda.set_device(device)

                print(f'Rank {rank}/{world_size} using', torch.cuda.get_device_name(local_rank))

                # Synthetic ImageNet-style data
                batch_size = 256
                num_batches = 200
                x = torch.randn(batch_size, 3, 224, 224, device=device)
                y = torch.randint(0, 1000, (batch_size,), device=device)

                model = models.resnet50().to(device)
                model = DDP(model, device_ids=[local_rank], output_device=local_rank)
                criterion = nn.CrossEntropyLoss()
                optimizer = optim.SGD(model.parameters(), lr=0.01, momentum=0.9)

                if rank == 0:
                    print('Warming up...')
                model.train()
                for _ in range(3):
                    optimizer.zero_grad()
                    with torch.amp.autocast('cuda', dtype=torch.bfloat16):
                        outputs = model(x)
                        loss = criterion(outputs, y)
                    loss.backward()
                    optimizer.step()
                torch.cuda.synchronize()

                dist.barrier()
                if rank == 0:
                    print(f'Beginning benchmark: {num_batches} batches of {batch_size} images per GPU (224x224, synthetic ImageNet)')
                    print(f'Effective batch size across all GPUs: {batch_size * world_size}')
                start = time.time()

                for i in range(num_batches):
                    optimizer.zero_grad()
                    with torch.amp.autocast('cuda', dtype=torch.bfloat16):
                        outputs = model(x)
                        loss = criterion(outputs, y)
                    loss.backward()
                    optimizer.step()

                    if rank == 0 and i % 10 == 0:
                        print(f'Batch {i}/{num_batches}, Loss {loss.item():.4f}')

                torch.cuda.synchronize()
                end = time.time()

                if rank == 0:
                    elapsed = end - start
                    total_images = batch_size * world_size * num_batches
                    print('Benchmark complete')
                    print(f'Total time: {elapsed:.3f} seconds')
                    print(f'Images/sec (combined): {total_images / elapsed:.1f}')
                    print(f'Avg batch time: {elapsed / num_batches * 1000:.2f} ms')

                dist.destroy_process_group()

            if __name__ == '__main__':
                main()
            EOF

            if [ "$NODE_RANK" = "0" ]; then
              MASTER_ADDR=$(hostname -i)
            else
              echo "Waiting for rank 0 to appear in DNS"
              for i in $(seq 1 150); do
                MASTER_ADDR=$(python3 -c "import socket; print(socket.gethostbyname('$MASTER_SERVICE'))" 2>/dev/null) && break
                sleep 2
              done
              [ -n "${MASTER_ADDR:-}" ] || { echo "Rank 0 never became resolvable"; exit 1; }
            fi

            echo "Rank $NODE_RANK using master $MASTER_ADDR:29500"
            torchrun --nnodes=2 --nproc_per_node=1 --node_rank=$NODE_RANK \
              --master_addr=$MASTER_ADDR --master_port=29500 /tmp/resnet50_ddp.py
