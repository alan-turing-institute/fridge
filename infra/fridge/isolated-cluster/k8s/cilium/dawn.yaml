---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: fridge-api-dawn
  namespace: fridge-api
spec:
  endpointSelector:
    matchLabels:
      app: fridge-api-server
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
