apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: configure-containerd-mirrors
  namespace: ${namespace}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: configure-containerd-mirrors
  template:
    metadata:
      labels:
        app: configure-containerd-mirrors
      annotations:
        # Roll the DaemonSet (and so re-run the init container) whenever the
        # registry configuration changes
        fridge/registry-config-hash: "${config_hash}"
    spec:
      initContainers:
      - name: configure-containerd
        image: busybox
        # This pod writes the registry configuration, so it must not depend on
        # it: use the image cached on the node so a broken mirror config can
        # still be fixed (an untagged image would otherwise always be pulled)
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -e
            echo "Configuring k3s containerd registry mirrors..."
            if [ -f /config/harbor-ca.pem ]; then
              echo "Installing Harbor CA bundle..."
              cp /config/harbor-ca.pem /host/etc/rancher/k3s/harbor-ca.pem
            else
              rm -f /host/etc/rancher/k3s/harbor-ca.pem
            fi
            # registries.yaml is only read when k3s starts, so it is what persists
            # the configuration across restarts
            cp /config/registries.yaml /host/etc/rancher/k3s/registries.yaml
            # containerd re-reads hosts.toml on every pull, so writing the files
            # k3s would generate from registries.yaml applies the configuration
            # immediately, without restarting k3s
            # (dollar signs are doubled in the source template to escape Python's string.Template)
            for file in /config/*.hosts.toml; do
              registry=$$(basename "$$file" .hosts.toml)
              mkdir -p "/host/k3s-containerd/certs.d/$$registry"
              cp "$$file" "/host/k3s-containerd/certs.d/$$registry/hosts.toml"
            done
            echo "Done."
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: host-k3s-config
            mountPath: /host/etc/rancher/k3s
          - name: host-k3s-containerd
            mountPath: /host/k3s-containerd
          - name: config
            mountPath: /config
            readOnly: true
      containers:
        - name: wait
          image: registry.k8s.io/pause:3.8
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 50Mi
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: host-k3s-config
          hostPath:
            path: /etc/rancher/k3s
            type: DirectoryOrCreate
        - name: host-k3s-containerd
          hostPath:
            # Must already exist: if it doesn't, the k3s data dir is wrong and
            # containerd would never read what we write
            path: ${k3s_containerd_dir}
            type: Directory
        - name: config
          configMap:
            name: ${config_map}
