deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: default

chunksCache:
  enabled: false

resultsCache:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
