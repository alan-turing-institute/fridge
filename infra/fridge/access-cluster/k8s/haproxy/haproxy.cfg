global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 30s
  timeout client 300s
  timeout server 300s
  log global
  option tcplog
  option dontlognull
  option log-separate-errors

# Prometheus metrics, including the results of the backend health checks.
# Bind to the pod's cluster IP only, so that VPN peers, which arrive on the
# NetBird interface in the same pod, can't reach it.
# The doubled dollar sign is escaped for Python's string.Template, so HAProxy
# sees the POD_IP environment variable
frontend metrics
    mode http
    bind "$${POD_IP}:8404"
    no log
    http-request use-service prometheus-exporter if { path /metrics }

frontend in_fridge_api_in
    bind *:8000
    default_backend out_fridge_api

backend out_fridge_api
    server fridge_api $fridge_api_endpoint check inter 10s

frontend in_k8s_api
    bind *:6443
    default_backend out_k8s_api

backend out_k8s_api
    server k8s_api $isolated_k8s_api_endpoint check inter 10s
